<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MindVault+</title>

<style>
:root {
  --bg: #0f172a;
  --card: #020617;
  --text: #ffffff;
  --accent: #38bdf8;
}

.light {
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #020617;
  --accent: #2563eb;
}

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  background: var(--card);
  padding: 24px;
  width: 90%;
  max-width: 380px;
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
  text-align: center;
}

h1 {
  margin: 0;
}

.top {
  display: flex;
  justify-content: space-between;
  margin: 10px 0;
}

#numberBox {
  font-size: 48px;
  margin: 20px 0;
  min-height: 60px;
  animation: fade 0.4s ease;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  font-size: 18px;
  text-align: center;
  margin-bottom: 10px;
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  font-weight: bold;
  margin: 6px 0;
  cursor: pointer;
  background: var(--accent);
  color: white;
}

.options {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.options button {
  flex: 1;
  font-size: 14px;
}

#message {
  margin-top: 8px;
  font-weight: bold;
}

@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* POPUP */
.popup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  display: none;
  justify-content: center;
  align-items: center;
}

.popup-content {
  background: var(--card);
  padding: 20px;
  border-radius: 16px;
  width: 90%;
  max-width: 320px;
  text-align: left;
}
</style>
</head>

<body>

<div class="card">
  <h1>🧠 MindVault+</h1>

  <div class="top">
    <span>Level: <b id="level">1</b></span>
    <span>Best: <b id="best">0</b></span>
  </div>

  <div id="numberBox">?</div>

  <input id="userInput" placeholder="Enter number" disabled>
  <button onclick="check()">Submit</button>

  <div id="message"></div>

  <div class="options">
    <button onclick="start()">▶ Start</button>
    <button onclick="resetGame()">🔄 Reset</button>
    <button onclick="toggleTheme()">🌗 Theme</button>
  </div>

  <button onclick="openHelp()">ℹ How to Play</button>
</div>

<!-- HELP POPUP -->
<div class="popup" id="help">
  <div class="popup-content">
    <h3>How to Play</h3>
    <ul>
      <li>A number appears for a moment</li>
      <li>Remember it carefully</li>
      <li>Type it correctly to level up</li>
      <li>Each level adds more digits</li>
    </ul>
    <button onclick="closeHelp()">Got it!</button>
  </div>
</div>

<script>
let level = 1;
let answer = "";
let best = localStorage.getItem("mindvault_best") || 0;
document.getElementById("best").innerText = best;

function start() {
  document.getElementById("message").innerText = "";
  document.getElementById("userInput").value = "";
  document.getElementById("userInput").disabled = true;

  answer = "";
  for (let i = 0; i < level + 1; i++) {
    answer += Math.floor(Math.random() * 10);
  }

  document.getElementById("numberBox").innerText = answer;

  setTimeout(() => {
    document.getElementById("numberBox").innerText = "?";
    document.getElementById("userInput").disabled = false;
    document.getElementById("userInput").focus();
  }, 1500);
}

function check() {
  const input = document.getElementById("userInput").value;
  if (input === answer) {
    level++;
    document.getElementById("level").innerText = level;
    document.getElementById("message").innerText = "✅ Correct!";
    document.getElementById("message").style.color = "lime";
    setTimeout(start, 800);
  } else {
    document.getElementById("message").innerText = "❌ Game Over!";
    document.getElementById("message").style.color = "red";
    if (level - 1 > best) {
      best = level - 1;
      localStorage.setItem("mindvault_best", best);
      document.getElementById("best").innerText = best;
    }
    level = 1;
    document.getElementById("level").innerText = level;
  }
}

function resetGame() {
  level = 1;
  document.getElementById("level").innerText = level;
  document.getElementById("numberBox").innerText = "?";
  document.getElementById("userInput").value = "";
}

function toggleTheme() {
  document.body.classList.toggle("light");
}

function openHelp() {
  document.getElementById("help").style.display = "flex";
}

function closeHelp() {
  document.getElementById("help").style.display = "none";
}
</script>

</body>
</html>
